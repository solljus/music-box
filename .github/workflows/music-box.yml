name: music-box
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # hourly
  push:
    branches: main       # i forgor to change this
jobs:
  musicbox:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - name: Setup Node runtime
       uses: actions/setup-node@v4
       with:
         node-version: '20'
       env:
         ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
     - run: npm install
     - name: Update
       uses: ./
       env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LFMUSERNAME: ${{ secrets.LFMUSERNAME }}
          GIST_ID: ${{ secrets.GIST_ID }}
     - name: Sync music stats to Forgejo profile
       run: |
         GIST_JSON=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
           https://api.github.com/gists/${{ secrets.GIST_ID }})
         echo "$GIST_JSON" | jq -r '.files | to_entries[0].value.content' > music.md

         README_JSON=$(curl -s -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
           https://git.ok.land/api/v1/repos/k/.profile/contents/README.md)
         SHA=$(echo "$README_JSON" | jq -r .sha)
         echo "$README_JSON" | jq -r .content | base64 -d > readme_current.md

         python3 - <<'PYEOF'
         with open('readme_current.md', encoding='utf-8') as f:
             readme = f.read()
         with open('music.md', encoding='utf-8') as f:
             music = f.read()
         start = '<!-- START_MUSIC_BOX -->'
         end = '<!-- END_MUSIC_BOX -->'
         pre, _, rest = readme.partition(start)
         _, _, post = rest.partition(end)
         new_readme = pre + start + '\n' + music.strip() + '\n' + end + post
         with open('readme_new.md', 'w', encoding='utf-8') as f:
             f.write(new_readme)
         PYEOF

         jq -n --arg content "$(base64 -w0 readme_new.md)" \
               --arg sha "$SHA" \
               --arg message "sync weekly music stats" \
               --arg branch "main" \
               '{message: $message, content: $content, sha: $sha, branch: $branch}' > payload.json

         curl -s -X PUT \
           -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
           -H "Content-Type: application/json" \
           -d @payload.json \
           https://git.ok.land/api/v1/repos/k/.profile/contents/README.md
