name: music-box
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'   # once daily

jobs:
  musicbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Update Gist
        uses: ./
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LFMUSERNAME: ${{ secrets.LFMUSERNAME }}
          GIST_ID: ${{ secrets.GIST_ID }}

      - name: Build music.svg from gist
        run: |
          GIST_JSON=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/gists/${{ secrets.GIST_ID }})
          echo "$GIST_JSON" | jq -r '.files | to_entries[0].value.content' > music.md

          mkdir -p generated

          python3 - <<'PYEOF'
          import re, html

          with open('music.md', encoding='utf-8') as f:
              raw = f.read()

          pattern = re.compile(r'^(.+?)\s+[\u2588-\u258F\u2591-\u2593]+\s*(\d+)\s+plays?\s*$', re.MULTILINE)
          artists = [(m.group(1).strip(), int(m.group(2))) for m in pattern.finditer(raw)]
          artists = artists[:6]

          total = sum(p for _, p in artists) or 1
          colors = ["#e34c26", "#563d7c", "#3572A5", "#00897b", "#fb8c00", "#EB8CEB"]

          progress_items = ''.join(
              f'<span style="background-color: {colors[i % len(colors)]};width: {plays/total*100:.3f}%;" class="progress-item"></span>'
              for i, (name, plays) in enumerate(artists)
          )

          legend_items = ''.join(
              f'''
          <li style="animation-delay: {i*150}ms;">
          <svg xmlns="http://www.w3.org/2000/svg" class="octicon" style="fill:{colors[i % len(colors)]};"
          viewBox="0 0 16 16" version="1.1" width="16" height="16"><path
          fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8z"></path></svg>
          <span class="lang">{html.escape(name)}</span>
          <span class="percent">{plays/total*100:.2f}%</span>
          </li>
          '''
              for i, (name, plays) in enumerate(artists)
          )

          svg = f'''<svg id="gh-dark-mode-only" width="360" height="210" xmlns="http://www.w3.org/2000/svg">
          <style>
          svg {{
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
            font-size: 14px;
            line-height: 21px;
          }}

          #background {{
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            fill: white;
            stroke: rgb(225, 228, 232);
            stroke-width: 1px;
            rx: 6px;
            ry: 6px;
          }}

          #gh-dark-mode-only:target #background {{
            fill: #0d1117;
            stroke-width: 0.5px;
          }}

          foreignObject {{
            width: calc(100% - 10px - 32px);
            height: calc(100% - 10px - 24px);
          }}

          h2 {{
            margin-top: 0;
            margin-bottom: 0.75em;
            line-height: 24px;
            font-size: 16px;
            font-weight: 600;
            color: rgb(36, 41, 46);
            fill: rgb(36, 41, 46);
          }}

          #gh-dark-mode-only:target h2 {{
            color: #c9d1d9;
            fill: #c9d1d9;
          }}

          ul {{
            list-style: none;
            padding-left: 0;
            margin-top: 0;
            margin-bottom: 0;
          }}

          li {{
            display: inline-flex;
            font-size: 12px;
            margin-right: 2ch;
            align-items: center;
            flex-wrap: nowrap;
            transform: translateX(-500%);
            animation: slideIn 2s ease-in-out forwards;
          }}

          @keyframes slideIn {{
            to {{
              transform: translateX(0);
            }}
          }}

          div.ellipsis {{
            height: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
          }}

          .octicon {{
            fill: rgb(88, 96, 105);
            margin-right: 0.5ch;
            vertical-align: top;
          }}

          #gh-dark-mode-only:target .octicon {{
            color: #8b949e;
            fill: #8b949e;
          }}

          .progress {{
            display: flex;
            height: 8px;
            overflow: hidden;
            background-color: rgb(225, 228, 232);
            border-radius: 6px;
            outline: 1px solid transparent;
            margin-bottom: 1em;
          }}

          #gh-dark-mode-only:target .progress {{
            background-color: rgba(110, 118, 129, 0.4);
          }}

          .progress-item {{
            outline: 2px solid rgb(225, 228, 232);
            border-collapse: collapse;
          }}

          #gh-dark-mode-only:target .progress-item {{
            outline: 2px solid #393f47;
          }}

          .lang {{
            font-weight: 600;
            margin-right: 4px;
            color: rgb(36, 41, 46);
          }}

          #gh-dark-mode-only:target .lang {{
            color: #c9d1d9;
          }}

          .percent {{
            color: rgb(88, 96, 105)
          }}

          #gh-dark-mode-only:target .percent {{
            color: #8b949e;
          }}
          </style>
          <g>
          <rect x="5" y="5" id="background" />
          <g>
          <foreignObject x="21" y="17" width="318" height="176">
          <div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

          <h2>This Week's Music (By Plays)</h2>

          <div>
          <span class="progress">
          {progress_items}
          </span>
          </div>

          <ul>
          {legend_items}
          </ul>

          </div>
          </foreignObject>
          </g>
          </g>
          </svg>'''

          with open('generated/music.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          PYEOF

      - name: Commit only if the stats actually changed
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          
          if git diff --quiet -- generated/music.svg; then
            echo "No change in weekly music stats, skipping commit."
            exit 0
          fi

          TS=$(date +%s)
          python3 - "$TS" <<'PYEOF'
          import sys, re
          ts = sys.argv[1]
          with open('README.md', encoding='utf-8') as f:
              readme = f.read()
          pattern = re.compile(r'(<!-- START_MUSIC_BOX -->).*?(<!-- END_MUSIC_BOX -->)', re.DOTALL)
          replacement = ('<!-- START_MUSIC_BOX -->\n'
                         f'        <img src="https://git.ok.land/k/.profile/media/branch/main/generated/music.svg?v={ts}" alt="Music stats" />\n'
                         '<!-- END_MUSIC_BOX -->')
          new_readme = pattern.sub(replacement, readme)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_readme)
          PYEOF

          # --- GPG-sign the commit using the F172ECD9CFC78C99 subkey ---
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          echo "$GPG_SIGNING_KEY" | gpg --batch --import

          git config user.name "k"
          git config user.email "k@mid-december.com"
          git config gpg.format openpgp
          git config user.signingkey F172ECD9CFC78C99
          git config commit.gpgsign true
          git config gpg.program gpg

          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
            git config gpg.openpgp.program "$(pwd)/gpg-wrapper.sh"
            cat > gpg-wrapper.sh << 'WRAPEOF'
          #!/bin/sh
          exec gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" "$@"
          WRAPEOF
            chmod +x gpg-wrapper.sh
          fi

          git add generated/music.svg README.md
          git commit -m "sync weekly music stats"

          git remote set-url origin "https://k:${FORGEJO_TOKEN}@git.ok.land/k/.profile.git"
          git push origin main
